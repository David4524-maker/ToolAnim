<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#0b2a4a,#0f766e 60%,#2dd4bf);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:20px;flex:1}
header select,header button{background:#ffffff26;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:5px 8px}
header option{color:#0b2a4a}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
.bar i{flex-basis:100%;height:0}
select{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:3px}
body.lab button[title]::after,body.lab label[title]::after{content:attr(title);font-size:11px;margin-left:4px}
#secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;padding:8px 10px}
#secs details{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:6px 8px}
#secs summary{font-weight:700;cursor:pointer;color:var(--ac);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
#secs summary::before{content:attr(data-i) " "}
#secs .row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
button{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:5px 9px;font-size:15px;cursor:pointer}
button.on{background:var(--ac);color:#04121f;border-color:var(--ac)}
label{display:flex;align-items:center;gap:4px;font-size:12px}
input[type=number],input[type=text]{width:64px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:3px}
input[type=color]{width:34px;height:28px;padding:0;border:0;background:none}
#stage{overflow:auto;max-height:68vh;padding:10px;text-align:center}
#cv{width:100%;max-width:none;background:#fff;border-radius:6px;box-shadow:0 2px 14px #0b2a4a55;touch-action:none;cursor:crosshair}
#tl{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--pn);border-top:1px solid var(--ln)}
#tl div{flex:none;position:relative;text-align:center;font-size:11px;border:2px solid var(--ln);border-radius:6px;cursor:pointer;background:var(--bg)}
#tl .x{position:absolute;top:3px;right:3px;width:18px;height:18px;padding:0;line-height:16px;border:0;border-radius:50%;background:#e11d48;color:#fff;font-size:11px;font-weight:700}
#tl div.on{border-color:var(--ac)}
#tl canvas{display:block;width:96px;height:54px}
#st{margin-left:auto;font-size:12px;opacity:.8}
